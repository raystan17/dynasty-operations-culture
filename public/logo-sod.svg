<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 420" role="img" aria-label="SoD Slinger's of Dynasty logo">
  <defs>
    <linearGradient id="scrollFill" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFF6E8" />
      <stop offset="100%" stop-color="#F3DEC0" />
    </linearGradient>
    <linearGradient id="goldStroke" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8A621C" />
      <stop offset="45%" stop-color="#C9983A" />
      <stop offset="100%" stop-color="#7A5317" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#000000" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- dark navy background -->
  <rect width="680" height="420" rx="24" fill="#060F2C" />

  <!-- football and throw trails -->
  <g transform="translate(0 -6)">
    <path d="M355 112 C410 118 462 132 520 160" fill="none" stroke="#C8942F" stroke-width="4" stroke-linecap="round" />
    <path d="M360 98 C428 104 500 124 564 154" fill="none" stroke="#D5A13B" stroke-width="4" stroke-linecap="round" />
    <path d="M362 86 C450 90 530 114 610 146" fill="none" stroke="#B8852A" stroke-width="4" stroke-linecap="round" />

    <g transform="translate(602 126) rotate(16)">
      <ellipse cx="0" cy="0" rx="52" ry="30" fill="#7C4A1F" stroke="#3A2615" stroke-width="4" />
      <path d="M-34 0 H34" stroke="#F5E8D0" stroke-width="3" />
      <path d="M-18 -10 L0 0 L18 10 M-18 10 L0 0 L18 -10" stroke="#F5E8D0" stroke-width="2.4" fill="none" />
    </g>
  </g>

  <!-- arm -->
  <g transform="translate(196 54)" fill="#F1C79A" stroke="#2A1A12" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" filter="url(#shadow)">
    <!-- upper arm / forearm contour -->
    <path d="M78 118 C64 86 64 64 78 50 C90 38 112 36 126 48 C140 62 140 86 126 104 C116 118 100 126 86 132 Z" />
    <!-- hand / fingers flick -->
    <path d="M88 58 C98 34 106 22 116 10 C120 6 126 6 128 12 C130 18 126 26 122 32 C132 14 140 8 148 6 C154 4 158 10 156 16 C154 24 146 32 138 38 C148 26 158 20 166 20 C172 20 176 26 174 32 C172 40 162 44 154 50 C162 42 170 40 176 42 C182 44 182 52 176 56 C164 64 144 66 126 68" fill="none" />
  </g>

  <!-- scroll -->
  <g transform="translate(58 190)" filter="url(#shadow)">
    <!-- side rolls -->
    <g transform="translate(8 42)">
      <ellipse cx="0" cy="0" rx="18" ry="56" fill="#D0A255" stroke="#7C5A24" stroke-width="3" />
      <ellipse cx="0" cy="0" rx="8.5" ry="40" fill="#F4D9A8" stroke="#9B7431" stroke-width="2" />
      <circle cx="0" cy="58" r="14" fill="#C7923C" stroke="#6F4E1E" stroke-width="3" />
      <circle cx="0" cy="58" r="5.5" fill="#E9C882" />
    </g>
    <g transform="translate(606 42)">
      <ellipse cx="0" cy="0" rx="18" ry="56" fill="#D0A255" stroke="#7C5A24" stroke-width="3" />
      <ellipse cx="0" cy="0" rx="8.5" ry="40" fill="#F4D9A8" stroke="#9B7431" stroke-width="2" />
      <circle cx="0" cy="58" r="14" fill="#C7923C" stroke="#6F4E1E" stroke-width="3" />
      <circle cx="0" cy="58" r="5.5" fill="#E9C882" />
    </g>

    <!-- main banner -->
    <path d="M34 0 H580 C596 0 606 12 606 28 V86 C606 102 596 114 580 114 H34 C18 114 8 102 8 86 V28 C8 12 18 0 34 0 Z"
      fill="url(#scrollFill)" stroke="url(#goldStroke)" stroke-width="4" />
    <!-- subtle creases -->
    <path d="M62 0 L56 114 M170 0 L176 114 M300 0 L294 114 M430 0 L436 114 M540 0 L534 114" stroke="#D3B17A" stroke-width="1.6" opacity="0.45" />

    <!-- top text -->
    <text x="306" y="56" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif"
      font-size="84" font-weight="700" letter-spacing="7" fill="#061134">SoD</text>

    <!-- bottom text -->
    <text x="306" y="94" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif"
      font-size="48" font-weight="700" letter-spacing="1.8" fill="#0A1D45">Slinger&apos;s of Dynasty</text>

    <!-- small diamonds -->
    <g fill="#D9A63A">
      <path d="M210 74 l6 6 l-6 6 l-6 -6 z" />
      <path d="M402 74 l6 6 l-6 6 l-6 -6 z" />
    </g>
  </g>
</svg>
