<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 220" role="img" aria-label="D.O.S. Dynasty of Slingers">
  <defs>
    <linearGradient id="parchment" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FAF4E8"/>
      <stop offset="100%" stop-color="#D4C4A0"/>
    </linearGradient>
    <linearGradient id="roll" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#9A7340"/>
      <stop offset="100%" stop-color="#C4A060"/>
    </linearGradient>
  </defs>

  <!-- Scroll -->
  <rect x="16" y="50" width="20" height="120" rx="10" fill="url(#roll)" stroke="#5C4020" stroke-width="1.5"/>
  <rect x="364" y="50" width="20" height="120" rx="10" fill="url(#roll)" stroke="#5C4020" stroke-width="1.5"/>
  <rect x="32" y="42" width="336" height="136" rx="5" fill="url(#parchment)" stroke="#B8860B" stroke-width="2.5"/>
  <line x1="48" y1="56" x2="352" y2="56" stroke="#C9B080" stroke-width="1" opacity="0.5"/>
  <line x1="48" y1="164" x2="352" y2="164" stroke="#C9B080" stroke-width="1" opacity="0.5"/>

  <!-- Typography -->
  <text
    x="108"
    y="118"
    font-family="Georgia, serif"
    font-size="50"
    font-weight="bold"
    letter-spacing="7"
    fill="#0B132B"
  >D.O.S.</text>
  <text
    x="108"
    y="140"
    font-family="Georgia, serif"
    font-size="9.5"
    letter-spacing="3.5"
    fill="#4A3A22"
  >DYNASTY OF SLINGERS</text>

  <!-- Slinger emblem (right side, geometric & readable) -->
  <g transform="translate(210 36)">
    <!-- Upper arm: thick at shoulder, tapers to elbow -->
    <path
      fill="#0B132B"
      d="M 4 130 L 28 108 L 44 82 L 36 74 L 12 98 L 0 118 Z"
    />
    <!-- Forearm: clear extension toward release -->
    <path
      fill="#0B132B"
      d="M 44 82 L 88 52 L 118 40 L 124 48 L 90 64 L 52 88 Z"
    />
    <!-- Hand -->
    <path fill="#0B132B" d="M 118 40 L 132 34 L 140 42 L 132 50 L 120 48 Z"/>
    <!-- Elbow joint circle -->
    <circle cx="46" cy="80" r="5" fill="#D4C4A0" stroke="#0B132B" stroke-width="2"/>
    <!-- Bicep accent -->
    <path fill="none" stroke="#D4A017" stroke-width="2" stroke-linecap="round" d="M 14 108 Q 30 92 42 82"/>

    <!-- Football -->
    <g transform="translate(152 30) rotate(30)">
      <ellipse rx="17" ry="10.5" fill="#5A3018" stroke="#0B132B" stroke-width="2"/>
      <line x1="-12" y1="0" x2="12" y2="0" stroke="#FAF4E8" stroke-width="1.5"/>
      <path d="M-6 -4 L0 0 L6 4 M-6 4 L0 0 L6 -4" stroke="#FAF4E8" stroke-width="1" fill="none"/>
    </g>
    <!-- Throw streaks -->
    <path d="M 176 24 Q 196 14 214 22" fill="none" stroke="#D4A017" stroke-width="2.5" stroke-linecap="round"/>
  </g>
</svg>
